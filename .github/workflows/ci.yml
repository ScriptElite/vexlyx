name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma generate` only needs a syntactically valid URL, it never connects.
  DATABASE_URL: postgresql://vexlyx:placeholder@localhost:5432/vexlyx_dev

jobs:
  mail-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/mail-state/run.sh

  mail-credential-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vexlyx-dovecot:credentials-test docker/dovecot
      - run: docker build -t vexlyx-postfix:credentials-test docker/postfix
      - run: python3 -m unittest tests.test_mail_credential_security tests.test_mail_credential_protocols -v
      - run: python3 -m unittest tests.test_roundcube_tls -v
      - run: python3 -m unittest tests.test_postfix_submission_pipelining -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      # turbo builds @vexlyx/shared first (typecheck dependsOn ^build).
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm test
      - run: python3 -m unittest discover -s tests -p test_restore_stop_safety.py
      - run: python3 -m unittest discover -s tests -p test_git_url_policy.py
      - run: python3 -m unittest discover -s tests -p test_git_clone_data_safety.py
      # Runs the real git binary against a local repository, so it needs no
      # network and no docker; git is preinstalled on the runner.
      - run: python3 -m unittest discover -s tests -p test_git_branch_switch.py
      - run: python3 -m unittest discover -s tests -p test_installer_release_channel.py
      - run: python3 -m unittest discover -s tests -p test_installer_repo_url.py
      # cryptography is what postfix_manager.py generates DKIM keys with (the
      # API image and the installer install it the same way); without it the
      # test would skip itself.
      - run: pip3 install cryptography
      - run: python3 -m unittest discover -s tests -p test_dkim_first_check.py
      - run: python3 -m unittest discover -s tests -p test_installer_nixpacks.py
      - run: python3 -m unittest discover -s tests -p test_dockerfile_build_nixpacks_absent.py
      # Same ordering guard for the detect step; mocks the resolver and the
      # subprocess layer, so it spawns nothing.
      - run: python3 -m unittest discover -s tests -p test_dockerfile_plan_nixpacks_absent.py
      - run: python3 -m unittest discover -s tests -p test_nginx_conf_refresh.py
      - run: python3 -m unittest discover -s tests -p test_nginx_served_paths.py
      - run: python3 -m unittest discover -s tests -p test_installer_traefik_config.py
      - run: python3 -m unittest discover -s tests -p test_installer_runtime.py
      - run: python3 -m unittest discover -s tests -p test_php_docroot_ownership.py
      - run: python3 -m unittest discover -s tests -p test_installer_panel_recreate.py
      - run: python3 -m unittest discover -s tests -p test_network_isolation.py
      # the post-deploy probe reaches the container's bridge address, but the
      # tests only bind a local socket, so they need no docker daemon.
      - run: python3 -m unittest discover -s tests -p test_post_deploy_routable_probe.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/dashboard/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm build
