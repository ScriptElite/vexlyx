# Docker Compose template for no-build PHP projects (F5.21)
# Generated by docker_manager.py -- do NOT edit manually.
# Plain PHP with no composer.json/buildCmd: fixed PHP-FPM (with common
# extensions baked in, see docker/php-fpm/Dockerfile) + nginx:alpine, same
# two-container shape F5.7 built for WordPress, generalized. Unlike
# WordPress's wp_core volume, here the project's own source directory is
# bind-mounted directly -- read-write on "app" (self-installing scripts like
# a Duplicator migration package need to write into their own docroot),
# read-only on "web" (nginx only ever reads).

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "{{php_fpm_image}}"
    restart: unless-stopped
    environment:
      PHP_MEMORY_LIMIT: "{{memory_limit}}"
{{env_block}}
    volumes:
      - "{{php_root}}:/var/www/html"
      # PHP owns the docroot directory (#151), so it could otherwise rename
      # deploy/ -- which the panel writes to as root -- and put its own in
      # place. A mount point cannot be renamed or removed from inside the
      # container, and :ro keeps its contents unwritable.
      - "{{deploy_dir}}:/var/www/html/deploy:ro"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    networks:
      - default

  web:
    image: "nginx:alpine"
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - "{{php_root}}:/var/www/html:ro"
      - "{{nginx_conf_path}}:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "{{host_port}}:80"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 $${HOSTNAME} 80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port=80"

networks:
  default:
    external: true
    name: vexlyx-apps
