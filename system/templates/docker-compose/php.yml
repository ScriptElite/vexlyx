# Docker Compose template for PHP applications (Laravel, Symfony, generic PHP)
# Generated by docker_manager.py -- do NOT edit manually.
# Uses Nginx + PHP-FPM managed by Nixpacks container runtime.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "{{image_name}}"
    restart: unless-stopped
    environment:
      PORT: "{{container_port}}"
      HOST: "0.0.0.0"
      PHP_MEMORY_LIMIT: "{{memory_limit}}"
{{env_block}}
    ports:
      - "{{host_port}}:{{container_port}}"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD", "php", "-r", "ini_set('default_socket_timeout',5);exit(@fsockopen('tcp://'.gethostname(),{{container_port}})?0:1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port={{container_port}}"

networks:
  default:
    external: true
    name: vexlyx-apps
