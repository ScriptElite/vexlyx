# Docker Compose template for Node.js / Next.js projects
# Generated by docker_manager.py -- do NOT edit manually.
# Variables ({{...}}) are substituted at generation time.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "{{image_name}}"
    restart: unless-stopped
    environment:
      PORT: "{{container_port}}"
      HOST: "0.0.0.0"
      NODE_ENV: production
{{env_block}}
    ports:
      - "{{host_port}}:{{container_port}}"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD", "node", "-e", "const socket=require('net').connect({{container_port}},require('os').hostname(),()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port={{container_port}}"

networks:
  default:
    external: true
    name: vexlyx-apps
