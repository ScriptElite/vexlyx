# Docker Compose template for Python projects (Django / Flask / FastAPI)
# Generated by docker_manager.py -- do NOT edit manually.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "{{image_name}}"
    restart: unless-stopped
    environment:
      PORT: "{{container_port}}"
      HOST: "0.0.0.0"
      FLASK_RUN_HOST: "0.0.0.0"
      FLASK_RUN_PORT: "{{container_port}}"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "{{container_port}}"
      GUNICORN_CMD_ARGS: "--bind=0.0.0.0:{{container_port}}"
      PYTHONUNBUFFERED: "1"
{{env_block}}
    ports:
      - "{{host_port}}:{{container_port}}"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection((socket.gethostname(), {{container_port}}), 5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port={{container_port}}"

networks:
  default:
    external: true
    name: vexlyx-apps
