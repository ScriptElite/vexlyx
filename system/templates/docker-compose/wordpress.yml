# Docker Compose template for WordPress applications
# Generated by docker_manager.py -- do NOT edit manually.
# F5.7: official wordpress:php8.3-fpm-alpine (PHP-FPM only) + nginx:alpine pair.
# Only wp-content persists on the host; WordPress core ships inside the image
# and lives in the shared "wp_core" volume so nginx can read it too.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "wordpress:php8.3-fpm-alpine"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: "{{wp_db_host}}"
      WORDPRESS_DB_NAME: "{{wp_db_name}}"
      WORDPRESS_DB_USER: "{{wp_db_user}}"
      WORDPRESS_DB_PASSWORD: "{{wp_db_password}}"
      WORDPRESS_TABLE_PREFIX: "{{wp_db_prefix}}"
      PHP_MEMORY_LIMIT: "{{memory_limit}}"
{{env_block}}
    volumes:
      - "wp_core_{{service_name}}:/var/www/html"
      - "../wp-content:/var/www/html/wp-content"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    networks:
      - default

  web:
    image: "nginx:alpine"
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - "wp_core_{{service_name}}:/var/www/html:ro"
      - "../wp-content:/var/www/html/wp-content:ro"
      - "{{nginx_conf_path}}:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "{{host_port}}:80"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 $${HOSTNAME} 80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port=80"

volumes:
  wp_core_{{service_name}}:

networks:
  default:
    external: true
    name: vexlyx-apps
