# Docker Compose template for static sites (React/Vite, plain HTML)
# Generated by docker_manager.py -- do NOT edit manually.
# F5.7: no per-deploy build/image. Fixed nginx:alpine bind-mounts the site
# content (raw source, or a Nixpacks-built output dir) read-only.

name: "vexlyx-{{service_name}}"

services:
  app:
    image: "nginx:alpine"
    restart: unless-stopped
    volumes:
      - "{{static_root}}:/usr/share/nginx/html:ro"
      - "{{nginx_conf_path}}:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "{{host_port}}:80"
    deploy:
      resources:
        limits:
          memory: "{{memory_limit}}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 $${HOSTNAME} 80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{service_name}}.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}.entrypoints=web"
      - "traefik.http.routers.{{service_name}}-secure.rule=Host(`{{hostname}}`)"
      - "traefik.http.routers.{{service_name}}-secure.entrypoints=websecure"
      - "traefik.http.routers.{{service_name}}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{service_name}}.loadbalancer.server.port=80"

networks:
  default:
    external: true
    name: vexlyx-apps
